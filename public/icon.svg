<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" opacity="0.12" filter="url(#glow)"/>

  <!-- Stylized Geometric "J" & Nest Shield -->
  <path d="M 330 140 
           L 330 290 
           C 330 365, 275 400, 205 400 
           C 145 400, 110 365, 110 325 
           C 110 300, 130 280, 155 280 
           C 180 280, 198 298, 198 322 
           C 198 335, 205 345, 225 345 
           C 255 345, 272 322, 272 278 
           L 272 140 
           Z" 
        fill="url(#goldGrad)" 
        filter="url(#glow)"/>

  <!-- Modern Accent Dot (Hyperlocal GPS Pin indicator) -->
  <circle cx="330" cy="140" r="28" fill="url(#accentGrad)" />
  <circle cx="330" cy="140" r="12" fill="#ffffff" opacity="0.9" />
</svg>
