<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060608" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="300" fill="url(#blueGlow)" />
  <circle cx="1000" cy="450" r="350" fill="#f59e0b" opacity="0.06" />

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Logo Mark -->
  <g transform="translate(120, 160)">
    <rect width="110" height="110" rx="28" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <path d="M 72 32 L 72 65 C 72 82, 60 90, 44 90 C 31 90, 23 82, 23 73 C 23 68, 27 63, 33 63 C 38 63, 42 67, 42 72 C 42 75, 44 77, 48 77 C 55 77, 59 72, 59 62 L 59 32 Z" fill="url(#gold)" />
    <circle cx="72" cy="32" r="7" fill="#fbbf24" />
  </g>

  <!-- Typography -->
  <text x="260" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1.5">
    Job<tspan fill="url(#gold)">Nest</tspan>
  </text>
  <text x="265" y="270" font-family="monospace" font-weight="700" font-size="16" fill="#f59e0b" letter-spacing="4">
    ENTERPRISE V2
  </text>

  <!-- Main Headline -->
  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-1">
    Hyperlocal Gig-Work &amp; Professional Marketplace
  </text>

  <!-- Subheadline -->
  <text x="120" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="24" fill="#94a3b8">
    Connecting skilled locals, trusted workers, and enterprise opportunities with AI trust verification.
  </text>

  <!-- Badges / Pillars -->
  <g transform="translate(120, 480)">
    <!-- Badge 1 -->
    <rect width="210" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#38bdf8">📍 Hyperlocal Radar</text>

    <!-- Badge 2 -->
    <rect x="230" width="220" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="250" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#34d399">🛡️ Aadhaar KYC Escrow</text>

    <!-- Badge 3 -->
    <rect x="470" width="230" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="490" y="27" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="600" fill="#fbbf24">⚡ Professional Mode</text>
  </g>
</svg>
